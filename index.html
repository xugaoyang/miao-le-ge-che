<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>喵了个车</title>
<style>
  :root{
    --bg:#FFF4E6; --bg2:#FFE7CC; --ink:#3B2F2F; --muted:#8A7563;
    --card:#FFFFFF; --accent:#FF8A3D; --accent2:#FF6B6B; --ok:#2DBE7E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{transition:background .4s;position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px;gap:6px}
  .pill{background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;
    box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap;flex:none}
  #levelLabel{color:var(--pageInk,var(--ink));font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
  .tools{display:flex;gap:6px}
  .iconbtn{border:0;background:var(--card);border-radius:12px;width:36px;height:36px;font-size:17px;
    box-shadow:0 2px 0 rgba(0,0,0,.1);cursor:pointer;padding:0}
  #sub{text-align:center;font-size:12px;color:var(--pageMuted,var(--muted));min-height:16px;padding:0 12px}
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #props{display:flex;justify-content:space-around;padding:8px 12px 6px}
  .prop{position:relative;border:0;background:var(--card);border-radius:16px;width:72px;height:64px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;
    box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer;color:var(--ink)}
  .prop i{font-style:normal}
  .prop span{font-size:12px;font-weight:600}
  .prop:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .prop.locked{opacity:.45}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--accent2);color:#fff;font-size:11px;font-style:normal;
    border-radius:999px;padding:2px 7px;font-weight:700;min-width:20px}
  .badge.count{background:#3B82F6}
  .badge:empty{display:none}
  #toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(59,47,47,.92);color:#fff;
    padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;
    white-space:nowrap;z-index:5;max-width:94%;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}
  .mask{position:absolute;inset:0;background:rgba(40,30,25,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  .mask[hidden]{display:none}
  .dialog{background:var(--card);border-radius:24px;padding:24px 20px;width:100%;max-width:340px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:90%;overflow:auto}
  .dialog h2{margin:0 0 6px;font-size:24px}
  .dialog p{margin:6px 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
  .big{font-size:52px;line-height:1.1}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
  .btn[disabled]{opacity:.45}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #D9682A}
  .btn.ad{background:var(--ok);color:#fff;box-shadow:0 3px 0 #1F9A63}
  .btn.ghost{background:#F3ECE4;color:var(--ink)}
  .adbox{background:#222;color:#fff;border-radius:16px;height:170px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
  .adbox b{font-size:40px}
  .dex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 4px}
  .dexcard{background:#FBF6F0;border-radius:14px;padding:10px 8px;display:flex;align-items:center;gap:8px;text-align:left}
  .dexcard.locked{opacity:.45}
  .dexcard.max{background:#FFF1C9}
  .dexicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;font-weight:800;flex:none}
  .dexcard b{display:block;font-size:14px}
  .dexcard small{font-size:11px;color:var(--muted)}
  .bar{height:5px;background:#EADFD1;border-radius:9px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .logo{font-size:56px;line-height:1}
  .homebtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px}
  .homebtn small{font-size:12px;font-weight:500;opacity:.9}
  .homerow{display:flex;gap:10px}
  .homerow .btn{flex:1}
  .dialog p.mini{font-size:12px;margin-top:12px}
  .sharecard{background:#F3ECE4;border-radius:14px;padding:12px;margin:10px 0;text-align:left}
  .sharetitle{font-size:14px;font-weight:700;line-height:1.4}
  .shareimg{margin-top:8px;height:90px;border-radius:10px;background:linear-gradient(135deg,#FFB36B,#FF7EB6);display:flex;
    align-items:center;justify-content:center;gap:8px;font-size:34px;color:#fff}
  .shareimg span{font-size:18px;font-weight:800}
  .provgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
  .prov{border:0;background:#F3ECE4;border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;color:var(--ink)}
  .prov.on{background:var(--accent);color:#fff}
  .rank{text-align:left;margin:6px 0}
  .rankrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:14px}
  .rankrow:nth-child(odd){background:#FBF6F0}
  .rankrow.me{background:#FFE2C8;font-weight:700}
  .rk{width:28px;text-align:center}
  .pv{flex:1}
  .nm{color:var(--muted);font-size:13px}
  .rankgap{text-align:center;color:var(--muted)}
  .dexcard{border:0;cursor:pointer;font:inherit;color:inherit;width:100%}
  canvas.portrait{width:44px;height:44px;position:static;flex:none}
  canvas.portrait.big{width:96px;height:96px;display:block;margin:0 auto 6px}
  .lv{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;font-size:11px;padding:1px 5px;vertical-align:middle}
  .skill{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
  .skill span{font-size:11px;color:var(--muted)}
  .skillrows{margin:6px 0 4px;text-align:left}
  .skillrow{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;font-size:13px}
  .skillrow span:nth-child(2){flex:1}
  .skillrow small{color:var(--muted);font-size:11px}
  .skillrow.cur{background:#FFE2C8;font-weight:700}
  .skillrow.future{opacity:.5}
  .coin{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-0.14em;font-style:normal;
    background:radial-gradient(circle at 35% 32%,#FFE58A 0,#F5B700 55%,#D99400 100%);box-shadow:inset 0 0 0 1.5px #C98800}
  .homegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .homegrid .btn{margin:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 6px;font-size:15px}
  .homegrid small{font-size:11px;font-weight:500;color:var(--muted)}
  .dot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent2)}
  .stars{font-size:46px;letter-spacing:6px;line-height:1.1}
  .stars span{color:#E7DCCF}
  .stars span.on{color:#FFC21A;text-shadow:0 2px 0 #E09A00}
  .hint{background:#F3ECE4;border-radius:12px;padding:9px;font-size:13px;margin:-4px 0 4px}
  .hint.ok{background:#FFF1C9;font-weight:700}
  .town{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:16px;margin:8px 0}
  .tile{background:rgba(255,255,255,.55);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tile .ti{font-size:34px;filter:grayscale(1);opacity:.3}
  .tile.done{background:rgba(255,255,255,.9)}
  .tile.done .ti{filter:none;opacity:1}
  .tile.next{outline:2px dashed var(--accent)}
  .tile small{font-size:11px;color:var(--muted)}
  .tile.pop .ti{animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  .ward{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .wcard{border:2px solid transparent;background:#FBF6F0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;font:inherit;color:inherit}
  .wcard.on{border-color:var(--accent);background:#FFF1E4}
  .wcard b{font-size:13px}
  .wcard small{font-size:11px;color:var(--muted)}
  canvas.carpv{position:static;width:64px;height:64px;display:block}
  canvas.carpv.long{width:150px;height:76px;margin:6px auto}
  .tag{font-style:normal;font-size:11px;border-radius:999px;padding:2px 8px;background:#E8F1FF;color:#2F6FD6;margin-top:2px}
  .tag.on{background:var(--accent);color:#fff}
  .tag.lock{background:#F0E8DF;color:var(--muted)}
  .dialog{color:#3B2F2F}
  #stats{text-align:center;font-size:10px;color:var(--pageMuted,var(--muted));opacity:.7;pointer-events:none;
    padding-bottom:calc(6px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill"><i class="coin"></i> <b id="coins">0</b></div>
    <div id="levelLabel">第 1 关</div>
    <div class="tools">
      <button class="iconbtn" id="btnHome" title="首页" aria-label="返回首页">🏠</button>
      <button class="iconbtn" id="btnSound" title="声音" aria-label="声音开关">🔊</button>
      <button class="iconbtn" id="btnRestart" title="重新开始" aria-label="重新开始">↻</button>
    </div>
  </header>
  <div id="sub"></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="props">
    <button class="prop" data-prop="undo"><i>↩️</i><span>撤回</span><em class="badge"></em></button>
    <button class="prop" data-prop="pop"><i>🏗️</i><span>移出3辆</span><em class="badge"></em></button>
    <button class="prop" data-prop="shuffle"><i>🔀</i><span>洗牌</span><em class="badge"></em></button>
    <button class="prop" data-prop="extra"><i>➕</i><span>加一格</span><em class="badge"></em></button>
  </div>
  <div id="stats"></div>
  <div id="toast"></div>
  <div class="mask" id="mask" hidden><div class="dialog" id="dialog"></div></div>
</div>

<script>
(() => {
'use strict';

// ---------- 基础配置 ----------
// 7 种颜色，每种配一个符号，辨色困难 / 色弱玩家也能靠符号区分
const PALETTE = ['#FF9F43','#4D8DF7','#FF6FAE','#2FBF71','#9D6BFF','#F2C230','#9AA6B2'];
const SYMBOLS = ['●','★','♥','▲','◆','✚','☾'];
const CAT_NAMES = ['橘子','蓝莓','桃桃','抹茶','葡萄','柠檬','汤圆'];
const DIRS = [
  {dx:0, dy:-1, a:0},            // 上
  {dx:1, dy:0,  a:Math.PI/2},    // 右
  {dx:0, dy:1,  a:Math.PI},      // 下
  {dx:-1,dy:0,  a:-Math.PI/2},   // 左
];
const BUFFER_CAP = 6;
// 金币图标用 CSS 绘制：部分手机系统不支持金币 emoji，会显示成灰色
const COIN = '<i class="coin"></i>';
const PROP_UNLOCK_LEVEL = 3;

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, R){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

// 关卡参数：锯齿形难度曲线，每 5 关一个 Boss 关，Boss 后一关放松
// outward：车头朝向最近边缘的概率，越低遮挡越深
function levelCfg(n){
  if(n===1) return {cols:4,rows:5,cars:9, colors:3,chunk:9,longP:0,   outward:1,   boss:false};
  if(n===2) return {cols:5,rows:6,cars:18,colors:4,chunk:6,longP:0.12,outward:0.6, boss:false};
  const boss = n % 5 === 0, relax = n % 5 === 1;
  const k = Math.min(n, 30);
  const cars = Math.min(27 + Math.floor(k*0.8) + (boss ? 6 : 0) - (relax ? 6 : 0), 51);
  const longP = Math.min(0.12 + k*0.006, 0.25);
  const dens = Math.min(0.85 + k*0.004, 0.95);       // 停车场密度越高，遮挡越深
  const cols = cars > 36 ? 7 : 6;
  const rows = Math.max(7, Math.min(10, Math.ceil(cars*(1+longP) / (cols*dens))));
  return {
    cols, rows, cars, longP,
    colors: Math.min(4 + Math.floor(k/3) + (boss ? 1 : 0), 7),
    chunk: (boss || k >= 8) ? 9 : 6,
    outward: Math.max(0.5 - k*0.01 - (boss ? 0.1 : 0) + (relax ? 0.1 : 0), 0.2),
    boss,
  };
}

// 关卡生成：先随机密铺小车，再模拟“逐辆开走”求解；
// 卡死时把某辆车掉头（只改方向不改占位，不影响之前已开走的车），仍不行就移除它。
// 这样开局可点的车少、遮挡链深，同时保证一定有解。
// 颜色按求出的离场顺序分块分配（每块最多 3 色）→ 按该顺序操作槽位最多占 6 格，保证 7 格可解。
// 每日挑战：全国同一天同一套关卡。第 1 关热身，第 2 关是难度断崖（仍保证有解）
function dailyCfg(stage){
  return stage === 1
    ? {cols:6,rows:8, cars:27,colors:5,chunk:6,longP:0.15,outward:0.5, boss:false}
    : {cols:7,rows:10,cars:57,colors:7,chunk:9,longP:0.2, outward:0.1, boss:true};
}
function dailySeed(dateStr, stage){ return Number(dateStr.replace(/-/g,'')) * 10 + stage; }

// 求解器：模拟玩家（贪心 + 随机扰动）多次尝试，找到一次通关即证明有解
function botSolvable(cfg, cars, tries, R){
  const {cols, rows} = cfg;
  const blocked = (grid, c) => {
    const d = DIRS[c.dir]; let x=c.x+d.dx, y=c.y+d.dy;
    while(x>=0 && y>=0 && x<cols && y<rows){ const o = grid.get(y*cols+x); if(o && o!==c) return true; x+=d.dx; y+=d.dy; }
    return false;
  };
  const g0 = new Map(); cars.forEach(c => c.cells.forEach(k => g0.set(k, c)));
  for(let t=0;t<tries;t++){
    const grid = new Map(g0); let slots = [], ok = true;
    while(grid.size){
      const free = [...new Set(grid.values())].filter(c => !blocked(grid, c));
      if(!free.length){ ok = false; break; }
      const cnt = c => slots.filter(s => s===c.color).length;
      const noise = t / tries * 3;
      free.sort((a,b) => cnt(b) - cnt(a) + (R() - .5) * noise);
      const c = free[0]; c.cells.forEach(k => grid.delete(k)); slots.push(c.color);
      if(cnt(c) >= 3){ let k=0; slots = slots.filter(s => s!==c.color || ++k > 3); }
      if(slots.length >= 7){ ok = false; break; }
    }
    if(ok) return true;
  }
  return false;
}
// 第 2 关用 4 色一组的颜色分块（更难，但不能从结构上保证有解）→ 求解器验证；验证不过就退回 3 色一组
const dailyCache = {};
function genDaily(dateStr, stage){
  const key = dateStr + '#' + stage;
  if(!dailyCache[key]) dailyCache[key] = genDailyRaw(dateStr, stage);
  return dailyCache[key];
}
function genDailyRaw(dateStr, stage){
  const seed = dailySeed(dateStr, stage);
  if(stage === 2){
    const hard = genLevel(0, Object.assign(dailyCfg(2), {chunk:12}), seed);
    if(botSolvable(hard.cfg, hard.cars, 300, mulberry32(seed))) return hard;
  }
  return genLevel(0, dailyCfg(stage), seed);
}

function genLevel(n, cfgIn, seed){
  const cfg = cfgIn || levelCfg(n);
  const R = mulberry32(seed != null ? seed : n * 1000 + 17);
  const {cols, rows} = cfg;
  const occ = new Array(cols*rows).fill(null);
  const inB = (x,y) => x>=0 && y>=0 && x<cols && y<rows;
  const cellsFor = (x,y,di,len) => {
    const d = DIRS[di], out = [];
    for(let j=0;j<len;j++){ const bx=x-d.dx*j, by=y-d.dy*j; if(!inB(bx,by) || occ[by*cols+bx]) return null; out.push(by*cols+bx); }
    return out;
  };
  const pickDir = (x,y) => {
    if(R() < cfg.outward){
      const ds = [y, cols-1-x, rows-1-y, x], m = Math.min(...ds);
      const opts = [0,1,2,3].filter(i => ds[i]===m);
      return opts[Math.floor(R()*opts.length)];
    }
    return Math.floor(R()*4);
  };
  let cars = [];
  for(const k of shuffle([...Array(cols*rows).keys()], R)){
    if(cars.length >= cfg.cars) break;
    if(occ[k]) continue;
    const x=k%cols, y=(k/cols)|0, di = pickDir(x,y);
    let len = R() < cfg.longP ? 2 : 1;
    let cells = cellsFor(x,y,di,len);
    if(!cells && len===2){ len = 1; cells = cellsFor(x,y,di,1); }
    if(!cells) continue;
    const car = {x, y, dir:di, len, cells};
    cells.forEach(c => occ[c] = car); cars.push(car);
  }
  const occ0 = occ.slice(); // 开局占位快照
  const freeIn = (grid, c) => {
    const d = DIRS[c.dir]; let x=c.x+d.dx, y=c.y+d.dy;
    while(inB(x,y)){ const o = grid[y*cols+x]; if(o && o!==c) return false; x+=d.dx; y+=d.dy; }
    return true;
  };
  const isFree = c => freeIn(occ, c);
  const setDir = (c, di) => {
    if(c.len===2){ const back = c.cells[1]; c.cells = [back, c.cells[0]]; c.x = back%cols; c.y = (back/cols)|0; }
    c.dir = di;
  };
  const order = [], alive = new Set(cars);
  while(alive.size){
    const free = [...alive].filter(isFree);
    if(free.length){
      const c = free[Math.floor(R()*free.length)];
      alive.delete(c); c.cells.forEach(k => occ[k] = null); order.push(c);
      continue;
    }
    // 优先选“现在能走、但开局被挡”的掉头方案，避免修复时制造开局就能开走的车
    let fixed = false;
    for(const strict of [true, false]){
      for(const c of shuffle([...alive], R)){
        const opts = c.len===2 ? [(c.dir+2)%4] : shuffle([0,1,2,3].filter(d => d!==c.dir), R);
        for(const di of opts){
          const old = {dir:c.dir, x:c.x, y:c.y, cells:c.cells};
          setDir(c, di);
          if(isFree(c) && (!strict || !freeIn(occ0, c))){ fixed = true; break; }
          Object.assign(c, old);
        }
        if(fixed) break;
      }
      if(fixed) break;
    }
    if(!fixed){ const c = [...alive][0]; alive.delete(c); c.cells.forEach(k => occ[k] = null); cars = cars.filter(x => x!==c); }
  }
  while(order.length % 3){ const c = order.pop(); cars = cars.filter(x => x!==c); }
  for(let i=0;i<order.length;){
    const size = Math.min(cfg.chunk, order.length - i);
    const colorIds = shuffle([...Array(cfg.colors).keys()], R).slice(0, size/3);
    const arr = []; colorIds.forEach(c => arr.push(c,c,c)); shuffle(arr, R);
    for(let j=0;j<size;j++) order[i+j].color = arr[j];
    i += size;
  }
  return {cfg, cars: cars.map(p => ({x:p.x, y:p.y, dir:p.dir, len:p.len, cells:p.cells.slice(), color:p.color}))};
}

// ---------- 存档（失败时降级为内存） ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mlgc2_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mlgc2_'+k, JSON.stringify(v)); }catch(e){} },
};
const meta = {
  level: store.get('level', 1),
  coins: store.get('coins', 0),
  inv: store.get('inv', {undo:0, pop:0, shuffle:0, extra:0}),

let actx = null;
function beep(freq, dur=0.08, type='sine', vol=0.08, delay=0){
  if(!meta.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur);
  }catch(e){}
}
function vibrate(ms){ try{ if(meta.sound && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
const sfx = {
  go(){ beep(520,.07,'triangle'); beep(780,.07,'triangle',.08,.05); },
  bonk(){ beep(110,.16,'square',.07); beep(70,.12,'square',.05,.04); vibrate(40); },
  clear(combo){ const b = 660 * Math.pow(1.12, Math.min(combo,6)); [0,1,2].forEach(i => beep(b*Math.pow(1.26,i),.1,'triangle',.07,i*.06)); vibrate(15); },
  horn(){ beep(392,.12,'square',.04); beep(392,.12,'square',.04,.16); },
  heart(){ beep(70,.09,'sine',.18); beep(62,.09,'sine',.14,.14); },
  win(){ [523,659,784,1046].forEach((f,i) => beep(f,.15,'triangle',.08,i*.11)); },
  lose(){ [400,300,200].forEach((f,i) => beep(f,.18,'sawtooth',.04,i*.13)); },
};

// ---------- 布局 ----------
function resize(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; H = r.height;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(S) layout();
}
function layout(){
  const {cols, rows} = S.cfg;
  const slotSize = Math.min((W - 40) / 8, 50);
  const trayH = slotSize + 16;
  const bufH = slotSize * 0.9;
  const bottomBlock = trayH + bufH + 26;
  const cell = Math.min((W - 28) / cols, (H - bottomBlock - 20) / rows, 64);
  const bw = cell*cols, bh = cell*rows;
  const freeH = H - bottomBlock - bh;
  const bx = (W - bw)/2, by = Math.max(12, freeH * 0.7); // 棋盘靠近槽位，减少视线移动
  const trayY = H - trayH - 8;
  const bufY = trayY - bufH - 8;
  L = {cell, bx, by, bw, bh, slotSize, trayY, trayH, bufY, bufH};
}
function cellCenter(k){ const c = S.cfg.cols; return {x: L.bx + (k%c + .5)*L.cell, y: L.by + (((k/c)|0) + .5)*L.cell}; }
function homeOf(c){
  let x=0, y=0; c.cells.forEach(k => { const p = cellCenter(k); x+=p.x; y+=p.y; });
  return {x: x/c.cells.length, y: y/c.cells.length};
}
function slotCenter(i, cap){
  const gap = 4, total = cap*L.slotSize + (cap-1)*gap;
  return {x: (W-total)/2 + i*(L.slotSize+gap) + L.slotSize/2, y: L.trayY + L.trayH/2};
}
function bufCenter(i){
  const gap = 6, s = L.bufH, total = BUFFER_CAP*s + (BUFFER_CAP-1)*gap;
  return {x: (W-total)/2 + i*(s+gap) + s/2, y: L.bufY + s/2};
}
function targetOf(c){
  if(c.state==='grid') return homeOf(c);
  if(c.state==='slot') return slotCenter(S.slots.indexOf(c), S.cap);
  if(c.state==='buffer') return bufCenter(S.buffer.indexOf(c));
  return {x:c.x, y:c.y};
}
function dimsOf(c){
  if(c.state==='grid' || c.path.length) return {l: c.len*L.cell - L.cell*0.14, w: L.cell*0.72, a: DIRS[c.dir].a};
  const s = (c.state==='buffer' ? L.bufH : L.slotSize) * 0.86;
  return {l:s, w:s, a:0};
}

// ---------- 规则 ----------
function blockerOf(c){
  const {cols, rows} = S.cfg, d = DIRS[c.dir];
  let x=c.fx+d.dx, y=c.fy+d.dy, steps=0;
  while(x>=0 && y>=0 && x<cols && y<rows){
    const o = S.grid[y*cols+x]; if(o && o!==c) return {car:o, steps};
    x+=d.dx; y+=d.dy; steps++;
  }
  return {car:null, steps};
}
function freeCars(){ return S.cars.filter(c => c.state==='grid' && !blockerOf(c).car); }

function tapGridCar(c){
  if(S.slots.length >= S.cap) return;
  const b = blockerOf(c);
  if(b.car){
    // 冲到挡路车前再弹回来
    c.bump = {t: performance.now(), dist: Math.max(0.14, b.steps) * L.cell};
    b.car.bang = performance.now() + 110;
    setTimeout(sfx.bonk, 100);
    return;
  }
  const d = DIRS[c.dir], h = homeOf(c);
  const out = b.steps + 0.6 + (c.len-1)*0.5;
  c.path = [{x: h.x + d.dx*out*L.cell, y: h.y + d.dy*out*L.cell}];
  c.speed = L.cell * 10; // 起步慢，逐渐加速
  c.cells.forEach(k => S.grid[k] = null);
  S.history.push(c);
  if(S.tutorial) S.tutorialStep = (S.tutorialStep||0) + 1;
  sfx.go();
  insertSlot(c);
}
function tapBufferCar(c){
  if(S.slots.length >= S.cap){ toast('槽位已满'); return; }
  S.buffer.splice(S.buffer.indexOf(c),1);
  sfx.go();
  insertSlot(c);
}
function insertSlot(c){
  c.state = 'slot';
  let idx = -1;
  for(let i=S.slots.length-1;i>=0;i--) if(S.slots[i].color===c.color){ idx=i; break; }
  if(idx>=0) S.slots.splice(idx+1, 0, c); else S.slots.push(c);
  const same = S.slots.filter(s => s.color===c.color);
  if(same.length >= 3){
    const trio = same.slice(0,3);
    const now = performance.now();
    S.combo = (now - S.lastClear < 3000) ? S.combo + 1 : 1;
    S.lastClear = now;
    trio.forEach(s => { const p = slotCenter(S.slots.indexOf(s), S.cap); s.dieX = p.x; s.dieY = p.y; });
    S.slots = S.slots.filter(s => !trio.includes(s));
    trio.forEach(s => { s.state = 'die'; if(s.path.length) s.path = [s.path[0], {x:s.dieX, y:s.dieY}]; });
    S.history = S.history.filter(h => h.state==='slot');
    callBus(trio, c.path.length ? 380 : 120, S.combo);
  }
  updateSub();
  checkEnd();
}

// 猫咪巴士：开进来 → 3 只猫上车 → 开走
function callBus(trio, delay, combo){
  const cx = trio.reduce((a,s) => a + s.dieX, 0) / 3;
  const bus = {cats:trio, color:trio[0].color, cx, start: performance.now() + delay, x: W + 200, seated:0, combo, fx:false};
  trio.forEach(s => s.bus = bus);
  S.buses.push(bus);
}
function busDims(){ return {w: L.slotSize*3.4, h: L.slotSize*1.0, y: L.trayY - L.slotSize*0.5 - 8}; }

function remaining(){ return S.cars.filter(c => c.state==='grid' || c.state==='slot' || c.state==='buffer').length; }
function updateSub(){
  if(S.mode === 'daily'){ if(S.level === 2) $('#sub').textContent = `⚠️ 难度断崖 · 剩余 ${remaining()} 辆车`; return; }
  if(S.level > 3 && !S.cfg.boss) $('#sub').textContent = `剩余 ${remaining()} 辆车`;
  else if(S.cfg.boss) $('#sub').textContent = `👑 Boss 关 · 剩余 ${remaining()} 辆车`;
}
function checkEnd(){
  if(S.over) return;
  if(remaining()===0){ S.over = true; setTimeout(showWin, 1400); }
  else if(S.slots.length >= S.cap){ S.over = true; setTimeout(showLose, 500); }
}

           run(){ const c = S.history.filter(h => h.state==='slot').pop();
                  S.history.splice(S.history.lastIndexOf(c),1); S.slots.splice(S.slots.indexOf(c),1);
                  c.state='grid'; c.path=[]; c.cells.forEach(k => S.grid[k]=c); }},
  pop:    {name:'移出3辆', icon:'🏗️', desc:'把槽位最右边 3 辆车吊到临时区', give:2, price:40,
           can(){ return S.slots.length>0 && S.buffer.length < BUFFER_CAP; }, why:'槽位是空的',
           run(){ popToBuffer(3); }},

           run(){ const g = S.cars.filter(c => c.state==='grid'); const cs = shuffle(g.map(c => c.color), Math.random);
                  g.forEach((c,i) => { c.color = cs[i]; c.appear = performance.now() + i*12; c.scale = 0; }); }},
  extra:  {name:'加一格', icon:'➕', desc:'本关槽位从 7 格变成 8 格', give:1, price:60,

function popToBuffer(n){
  const take = Math.min(n, S.slots.length, BUFFER_CAP - S.buffer.length);
  const moved = S.slots.splice(S.slots.length - take, take);
  moved.forEach(c => { c.state='buffer'; c.path=[]; S.buffer.push(c); });
  S.history = S.history.filter(h => h.state==='slot');
}
function applyProp(key){ S.assisted = true; PROPS[key].run(); refreshProps(); updateSub(); }
function useProp(key){
  if(!S || S.over || !mask.hidden) return;
  const p = PROPS[key];
  if(S.mode === 'daily'){
    // 每日挑战：为了排行公平，不用库存，每种道具每局限 1 次，通过广告或分享获得

  if(key === 'undo' && S.freeUndo > 0){ S.freeUndo--; applyProp(key); toast(`🫐 蓝莓的后悔药：免费撤回（本关还剩 ${S.freeUndo} 次）`); return; }
  if(meta.inv[key] > 0){ meta.inv[key]--; save(); applyProp(key); return; }

    meta.inv[key] += p.give - 1; save(); applyProp(key); toast(`已使用 1 个，剩余 ${meta.inv[key]} 个`);
  });
  $('#pShare').onclick = () => shareHelp(`我在喵了个车第 ${S.level} 关卡住了，帮我点一下送个「${p.name}」！`, () => applyProp(key));
  $('#pBuy').onclick = () => { meta.coins -= p.price; save(); closeDialog(); applyProp(key); refreshStats(); };
  $('#pNo').onclick = closeDialog;
}
function refreshProps(){
  const daily = S && S.mode === 'daily';
  const locked = !S || (!daily && S.level < PROP_UNLOCK_LEVEL);
  document.querySelectorAll('.prop').forEach(b => {
    const key = b.dataset.prop, badge = b.querySelector('.badge');

    badge.textContent = n > 0 ? n : '+';
    badge.className = 'badge' + (n > 0 ? ' count' : '');

function showWinAgain(){ closeDialog(); goNext(); }
function goNext(){
  closeDialog();

  if(lv > 3 && lv % 2 === 0) showInterstitial(() => newGame(lv)); else newGame(lv);
}
function restartCurrent(){
  closeDialog();
  if(S.mode === 'daily'){
    if(S.level === 2){ meta.daily.attempts++; save(); }
    newGame(S.level, 'daily');
  } else {
    const played = S.over || S.cars.some(c => c.state !== 'grid');
    if(played && meta.winStreak > 0){ toast(`🔥${meta.winStreak} 连胜已中断`); meta.winStreak = 0; save(); }
    newGame(S.level);
  }
}
function showLose(){
  if(S.loseSfx !== S.revives){ sfx.lose(); S.loseSfx = S.revives; } // 从广告/分享返回时不重复播放
  const daily = S.mode === 'daily';
  const left = remaining();
  const pct = Math.round((1 - left / S.total) * 100);
  const title = pct >= 60 ? `只差 ${left} 辆车！` : '槽位塞满啦！';
  const tip = pct >= 60 ? `你已经完成了 ${pct}%，再坚持一下就能过关` : `已完成 ${pct}%，先挑能凑齐三辆的颜色点哦`;

  const matcha = S.mode === 'level' && S.matchaAvail ? '<button class="btn ad" id="matcha">🍵 抹茶的佛系复活（免费）</button>' : '';
  if(S.revives === 0) btn = '<button class="btn ad" id="revive">📺 看广告复活（移出 3 辆车）</button>';
  else if(S.revives === 1) btn = '<button class="btn primary" id="revive">📤 分享求助复活</button>';
  else if(S.revives === 2 && !daily) btn = `<button class="btn primary" id="revive" ${meta.coins < COST ? 'disabled' : ''}>${COIN} ${COST} 金币复活</button>`;
  openDialog(`<div class="big">😿</div><h2>${title}</h2><p>${tip}${!daily && meta.winStreak >= 2 ? `<br><b style="color:#EF4F4F">重新开始将中断 🔥${meta.winStreak} 连胜！</b>` : ''}</p>${matcha}${btn}
    <button class="btn ghost" id="retry">${daily && S.level === 2 ? '再挑战一次' : '重新开始'}</button>
    ${daily ? '<button class="btn ghost" id="home">返回首页</button>' : ''}`);
  const doRevive = () => { S.revives++; S.over = false; closeDialog(); popToBuffer(3); };
  const mt = $('#matcha');
  if(mt) mt.onclick = () => { S.matchaAvail = false; S.matchaUsed = true; S.over = false; closeDialog(); popToBuffer(3); toast('🍵 抹茶：慢慢来，不着急～'); };
  const rv = $('#revive');
  if(rv){
    if(S.revives === 0) rv.onclick = () => showRewardAd('复活一次', doRevive, showLose);
    else if(S.revives === 1) rv.onclick = () => shareHelp(
      daily ? `我在喵了个车今日挑战第 2 关只差 ${left} 辆车，快来帮我！` : `我在喵了个车第 ${S.level} 关只差 ${left} 辆车，快来帮我！`,
      doRevive, showLose);
    else rv.onclick = () => { meta.coins -= COST; save(); refreshStats(); doRevive(); };
  }
  $('#retry').onclick = restartCurrent;
  const hm = $('#home'); if(hm) hm.onclick = showHome;
}

function mockPassRate(){ const R = mulberry32(dailySeed(today(), 7)); return (0.8 + R()*2.4).toFixed(1); }
function mockRanking(){
  // 示例数据：按日期生成固定的各省通关人数，再加上玩家自己的贡献；正式版由云开发汇总
  const R = mulberry32(dailySeed(today(), 9));
  const rows = PROVINCES.map((p,i) => ({p, n: Math.floor(PROV_POP[i] * (60 + R()*140))}));

// 背景装饰：棋盘上方空白处摆放主题物件 + 缓慢飘落的氛围粒子（画在棋盘下层）
function drawScenery(now, dt){
  const th = currentTheme();
  if(ambient.length < 10 && Math.random() < dt * 3){
    ambient.push({x: Math.random()*W, y: -20, vy: 14 + Math.random()*18, sway: Math.random()*Math.PI*2, size: 12 + Math.random()*8});
  }
  ctx.save(); ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.45;
  for(const p of ambient){
    p.y += p.vy*dt; p.sway += dt;
    ctx.font = `${Math.round(p.size)}px sans-serif`;
    ctx.fillText(th.amb, p.x + Math.sin(p.sway)*12, p.y);
  }
  ambient = ambient.filter(p => p.y < H + 20);
  const top = L.by - 14;
  if(top > 34){
    ctx.globalAlpha = 0.9;
    const R = mulberry32(dayNumber(today()));
    const n = Math.min(6, Math.floor(W / 64));
    for(let i=0;i<n;i++){
      const x = (i + 0.5) * W / n + (R() - .5) * 20;
      const y = Math.max(20, top - 10 - R() * Math.min(60, top - 30));
      ctx.font = `${Math.round(22 + R()*10)}px sans-serif`;
      ctx.fillText(th.deco[i % th.deco.length], x, y + Math.sin(now/600 + i) * 2);
    }
  }
  ctx.restore();
}

function showTown(back=closeDialog){

// ---------- 装扮（皮肤衣柜） ----------
function drawCarPreview(cv, i, len=1){
  const g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = cv.clientWidth || 64, h = cv.clientHeight || 64;
  cv.width = w*dpr; cv.height = h*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const s = Math.min(w, h) * 0.78;
  const fake = {color:i, dir: len === 2 ? 1 : 0, len, x:w/2, y:h/2 + 3, dl: len === 2 ? s*1.9 : s, dw: s*0.86,
    ang: len === 2 ? Math.PI/2 : 0, scale:1, bump:null, bang:0, path:[]};
  const saved = ctx; ctx = g;
  try{ drawCar(fake, performance.now()); } finally { ctx = saved; }
}

      <canvas class="carpv" data-i="${i}"></canvas>
      <b>${info.skin} ${info.skinName}</b><small>${name}专属</small>${status}</button>`;
  }).join('');
  openDialog(`<h2>🎨 装扮</h2><p>佩戴后，这种颜色的小猫车都会戴上<br><span style="font-size:12px">点卡片佩戴 / 取下或购买</span></p>

// 猫咪画像（图鉴用）
function drawPortrait(cv, i, locked){
  const g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 3);
  const size = cv.clientWidth || 44;
  cv.width = size*dpr; cv.height = size*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const color = locked ? '#CDBFAE' : PALETTE[i], s = size, cx = s/2, cy = s*0.58;
  g.fillStyle = locked ? '#EFE6DB' : shade(PALETTE[i], 1.25) ;
  g.beginPath(); g.arc(cx, s/2, s*0.48, 0, Math.PI*2); g.fill();
  g.fillStyle = color;
  g.beginPath(); g.moveTo(cx - s*0.32, cy - s*0.06); g.lineTo(cx - s*0.27, cy - s*0.42); g.lineTo(cx - s*0.05, cy - s*0.24); g.fill();
  g.beginPath(); g.moveTo(cx + s*0.32, cy - s*0.06); g.lineTo(cx + s*0.27, cy - s*0.42); g.lineTo(cx + s*0.05, cy - s*0.24); g.fill();
  g.beginPath(); g.ellipse(cx, cy, s*0.31, s*0.27, 0, 0, Math.PI*2); g.fill();
  if(locked){
    g.fillStyle = '#fff'; g.font = `bold ${Math.round(s*0.32)}px sans-serif`; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('?', cx, cy + 1); return;
  }
  g.fillStyle = '#FFC4D6';
  g.beginPath(); g.moveTo(cx - s*0.26, cy - s*0.1); g.lineTo(cx - s*0.24, cy - s*0.32); g.lineTo(cx - s*0.1, cy - s*0.22); g.fill();
  g.beginPath(); g.moveTo(cx + s*0.26, cy - s*0.1); g.lineTo(cx + s*0.24, cy - s*0.32); g.lineTo(cx + s*0.1, cy - s*0.22); g.fill();
  g.fillStyle = '#2B2222';
  g.beginPath(); g.arc(cx - s*0.11, cy - s*0.02, s*0.04, 0, Math.PI*2); g.arc(cx + s*0.11, cy - s*0.02, s*0.04, 0, Math.PI*2); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(cx - s*0.1, cy - s*0.04, s*0.014, 0, Math.PI*2); g.arc(cx + s*0.12, cy - s*0.04, s*0.014, 0, Math.PI*2); g.fill();
  g.fillStyle = '#FF7A9C';
  g.beginPath(); g.moveTo(cx - s*0.03, cy + s*0.05); g.lineTo(cx + s*0.03, cy + s*0.05); g.lineTo(cx, cy + s*0.09); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `bold ${Math.round(s*0.13)}px sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(SYMBOLS[i], cx, cy + s*0.17);
  if(skinOn(i)){ g.font = `${Math.round(s*0.26)}px sans-serif`; g.fillText(CAT_INFO[i].skin, cx, cy - s*0.32); }
}

function hitBuffer(x,y){
  for(let i=0;i<S.buffer.length;i++){ const p = bufCenter(i); if(Math.abs(x-p.x) < L.bufH/2 && Math.abs(y-p.y) < L.bufH/2) return S.buffer[i]; }

}
function hitGrid(x,y){
  if(x<L.bx || y<L.by || x>=L.bx+L.bw || y>=L.by+L.bh) return null;
  return S.grid[Math.floor((y-L.by)/L.cell)*S.cfg.cols + Math.floor((x-L.bx)/L.cell)];

// ---------- 绘制 ----------
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.round((n>>16)*f)), g=Math.min(255,Math.round((n>>8&255)*f)), b=Math.min(255,Math.round((n&255)*f));
  return `rgb(${r},${g},${b})`;
}
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function catFace(cx, cy, s, color){
  // 小猫脸（用于巴士车窗）
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(cx - s*0.45, cy - s*0.1); ctx.lineTo(cx - s*0.38, cy - s*0.6); ctx.lineTo(cx - s*0.08, cy - s*0.32); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + s*0.45, cy - s*0.1); ctx.lineTo(cx + s*0.38, cy - s*0.6); ctx.lineTo(cx + s*0.08, cy - s*0.32); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, s*0.42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2B2222';
  ctx.beginPath(); ctx.arc(cx - s*0.15, cy - s*0.03, s*0.06, 0, Math.PI*2); ctx.arc(cx + s*0.15, cy - s*0.03, s*0.06, 0, Math.PI*2); ctx.fill();
}
function drawCar(c, now){
  let x = c.x, y = c.y;
  const d = DIRS[c.dir];
  if(c.bump){
    const e = (now - c.bump.t) / 320;
    if(e >= 1) c.bump = null;
    else { const k = e < 0.35 ? e/0.35 : Math.max(0, 1 - (e-0.35)/0.65) * Math.cos((e-0.35)*14) ; const off = Math.max(-0.15, k) * c.bump.dist; x += d.dx*off; y += d.dy*off; }
  }
  if(c.bang && now > c.bang && now - c.bang < 260){ x += Math.sin(now/14) * 3; }
  const color = PALETTE[c.color];
  const l = c.dl, w = c.dw, s = Math.min(l, w);
  ctx.save(); ctx.translate(x,y); ctx.rotate(c.ang); ctx.scale(c.scale, c.scale);
  const r = s*0.26;
  // 阴影
  ctx.fillStyle='rgba(60,40,20,.18)'; rr(-w/2+1, -l/2+4, w, l, r); ctx.fill();
  // 车轮
  ctx.fillStyle = '#3B2F2F';
  const wy = l > w*1.5 ? [-l*0.36, -l*0.12, l*0.12, l*0.36] : [-l*0.27, l*0.27];
  for(const sx of [-1,1]) for(const yy of wy){ rr(sx*w/2 - s*0.07, yy - s*0.09, s*0.14, s*0.18, s*0.04); ctx.fill(); }
  // 耳朵（车头）
  ctx.lineWidth = Math.max(1.2, s*0.035); ctx.strokeStyle = shade(color,.7);
  for(const sx of [-1,1]){
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(sx*w*0.44, -l/2 + s*0.22); ctx.lineTo(sx*w*0.36, -l/2 - s*0.16); ctx.lineTo(sx*w*0.06, -l/2 + s*0.08);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFC4D6';
    ctx.beginPath(); ctx.moveTo(sx*w*0.34, -l/2 + s*0.14); ctx.lineTo(sx*w*0.32, -l/2 - s*0.06); ctx.lineTo(sx*w*0.16, -l/2 + s*0.08); ctx.closePath(); ctx.fill();
  }
  // 车身
  ctx.fillStyle = color; rr(-w/2, -l/2, w, l, r); ctx.fill(); ctx.stroke();
  // 车头大灯
  ctx.fillStyle = '#FFF6C2';
  ctx.beginPath(); ctx.arc(-w*0.30, -l/2 + s*0.1, s*0.06, 0, Math.PI*2); ctx.arc(w*0.30, -l/2 + s*0.1, s*0.06, 0, Math.PI*2); ctx.fill();
  // 脸（靠近车头）
  const fy = -l/2 + s*0.36;
  ctx.fillStyle = '#2B2222';
  ctx.beginPath(); ctx.arc(-w*0.17, fy, s*0.06, 0, Math.PI*2); ctx.arc(w*0.17, fy, s*0.06, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-w*0.15, fy - s*0.025, s*0.022, 0, Math.PI*2); ctx.arc(w*0.19, fy - s*0.025, s*0.022, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FF7A9C';
  ctx.beginPath(); ctx.moveTo(-s*0.04, fy + s*0.06); ctx.lineTo(s*0.04, fy + s*0.06); ctx.lineTo(0, fy + s*0.11); ctx.closePath(); ctx.fill();
  // 车尾：颜色符号（色弱也能区分）
  const sy = l/2 - s*0.28;
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(0, sy, s*0.19, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(0, sy); ctx.rotate(-c.ang);
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(s*0.26)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(SYMBOLS[c.color], 0, s*0.01);
  ctx.restore();
  if(skinOn(c.color)){
    // 皮肤戴在两耳之间，尺寸足够在停车场里一眼认出
    ctx.fillStyle = '#000'; // emoji 会继承 fillStyle 的透明度，这里必须是不透明色
    ctx.font = `${Math.round(s*0.46)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(CAT_INFO[c.color].skin, 0, -l/2 + s*0.1);
  }
  // 加长车：车顶金币，送回家额外 +3
  if(c.len === 2){
    const cx0 = l > w*1.5 ? 0 : w*0.3, cy0 = l > w*1.5 ? 0 : -l*0.3, r0 = s*0.15;
    ctx.save(); ctx.translate(cx0, cy0); ctx.rotate(-c.ang);
    const gr = ctx.createRadialGradient(-r0*0.3, -r0*0.3, r0*0.1, 0, 0, r0);
    gr.addColorStop(0, '#FFE58A'); gr.addColorStop(0.6, '#F5B700'); gr.addColorStop(1, '#D99400');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#B97E00'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#8A5A00'; ctx.font = `900 ${Math.round(r0*1.1)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('3', 0, r0*0.08);
    ctx.restore();
  }
  // 被撞到时的红色闪烁
  if(c.bang && now > c.bang && now - c.bang < 500){
    ctx.fillStyle = `rgba(239,79,79,${0.45*(1-(now-c.bang)/500)})`; rr(-w/2, -l/2, w, l, r); ctx.fill();
  }
  ctx.restore();
  // 被撞到时冒出“！”
  if(c.bang && now > c.bang && now - c.bang < 700){
    const e = (now - c.bang)/700, by = y - s*0.75 - e*10;
    ctx.globalAlpha = 1 - e*e;
    ctx.fillStyle = '#EF4F4F'; ctx.beginPath(); ctx.arc(x + s*0.35, by, s*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(s*0.3)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('!', x + s*0.35, by + 1);
    ctx.globalAlpha = 1;
  }
}
function drawBoard(){
  const {cols, rows} = S.cfg;
  const th = currentTheme();
  ctx.fillStyle = S.cfg.boss ? shade(th.frame, 0.93) : th.frame; rr(L.bx-8, L.by-8, L.bw+16, L.bh+16, 18); ctx.fill();
  ctx.fillStyle = th.lot; rr(L.bx-2, L.by-2, L.bw+4, L.bh+4, 14); ctx.fill();
  ctx.strokeStyle = th.line; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  for(let i=1;i<cols;i++){ ctx.beginPath(); ctx.moveTo(L.bx+i*L.cell, L.by+4); ctx.lineTo(L.bx+i*L.cell, L.by+L.bh-4); ctx.stroke(); }
  for(let j=1;j<rows;j++){ ctx.beginPath(); ctx.moveTo(L.bx+4, L.by+j*L.cell); ctx.lineTo(L.bx+L.bw-4, L.by+j*L.cell); ctx.stroke(); }
  ctx.setLineDash([]);
}
function drawPreview(c){
  const d = DIRS[c.dir], b = blockerOf(c);
  const f = cellCenter(c.fy*S.cfg.cols + c.fx);
  const sx = f.x + d.dx*L.cell*0.45, sy = f.y + d.dy*L.cell*0.45;
  const len = b.car ? b.steps*L.cell + L.cell*0.1 : (b.steps + 0.6)*L.cell;
  const ex = sx + d.dx*len, ey = sy + d.dy*len;
  const col = b.car ? '#EF4F4F' : '#2DBE7E';
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = L.cell*0.16; ctx.lineCap = 'round'; ctx.globalAlpha = 0.75;
  ctx.setLineDash([L.cell*0.2, L.cell*0.16]); ctx.lineDashOffset = -performance.now()/30;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  if(b.car){
    const h = homeOf(b.car);
    ctx.strokeStyle = '#EF4F4F'; ctx.lineWidth = 3;
    const bw = (b.car.dir%2 ? b.car.len : 1)*L.cell, bh = (b.car.dir%2 ? 1 : b.car.len)*L.cell;
    rr(h.x - bw/2 + 2, h.y - bh/2 + 2, bw - 4, bh - 4, 10); ctx.stroke();
  }
  ctx.restore();
}
function drawTray(now){
  const first = slotCenter(0, S.cap), last = slotCenter(S.cap-1, S.cap);
  const pad = 8, s = L.slotSize;
  const danger = S.slots.length >= S.cap - 2 && !S.over;
  const th = currentTheme();
  ctx.fillStyle = th.tray; rr(first.x - s/2 - pad, L.trayY, last.x - first.x + s + pad*2, L.trayH, 16); ctx.fill();
  for(let i=0;i<S.cap;i++){
    const p = slotCenter(i, S.cap);
    ctx.fillStyle = i===7 ? shade(th.slot, 1.5) : th.slot; rr(p.x - s/2, p.y - s/2, s, s, 10); ctx.fill();
  }
  if(danger){
    ctx.strokeStyle = `rgba(239,79,79,${0.5+0.5*Math.sin(now/120)})`; ctx.lineWidth = 3;
    rr(first.x - s/2 - pad, L.trayY, last.x - first.x + s + pad*2, L.trayH, 16); ctx.stroke();
    ctx.fillStyle = '#EF4F4F'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline='alphabetic';
    ctx.fillText(`⚠ 只剩 ${S.cap - S.slots.length} 格`, last.x + s/2 + pad, L.trayY - 6);
  }
  if(S.buffer.length){
    ctx.fillStyle = 'rgba(122,92,72,.15)';
    const b0 = bufCenter(0), b1 = bufCenter(BUFFER_CAP-1);
    rr(b0.x - L.bufH/2 - 6, L.bufY - 4, b1.x - b0.x + L.bufH + 12, L.bufH + 8, 12); ctx.fill();
    ctx.fillStyle = '#8A7563'; ctx.font = '11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('临时区（点击放回槽位）', b0.x - L.bufH/2, L.bufY - 8);
  }
}
function drawBus(bus){
  const {w, h, y} = busDims();
  const x = bus.x, color = PALETTE[bus.color];
  ctx.save();
  ctx.fillStyle = 'rgba(60,40,20,.2)'; rr(x - w/2 + 2, y - h/2 + 5, w, h, h*0.3); ctx.fill();
  ctx.fillStyle = '#3B2F2F';
  [-0.3, 0.3].forEach(k => { ctx.beginPath(); ctx.arc(x + k*w, y + h/2, h*0.17, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = color; ctx.strokeStyle = shade(color, .7); ctx.lineWidth = 2;
  rr(x - w/2, y - h/2, w, h, h*0.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFF6C2'; ctx.beginPath(); ctx.arc(x - w/2 + h*0.12, y + h*0.12, h*0.08, 0, Math.PI*2); ctx.fill();
  for(let i=0;i<3;i++){
    const wx = x + (i-1)*w*0.27 + w*0.04, wy = y - h*0.08;
    ctx.fillStyle = '#E8F6FF'; rr(wx - h*0.3, wy - h*0.28, h*0.6, h*0.5, 6); ctx.fill();
    if(i < bus.seated){ ctx.save(); rr(wx - h*0.3, wy - h*0.28, h*0.6, h*0.5, 6); ctx.clip(); catFace(wx, wy + h*0.08, h*0.42, color); ctx.restore(); }
  }
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(h*0.2)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`${SYMBOLS[bus.color]} 喵巴士`, x + w*0.04, y + h*0.33);
  ctx.restore();
}
function drawHand(now){
  if(!S.tutorial || S.over) return;
  const free = freeCars(); if(!free.length) return;
  const cnt = c => S.slots.filter(s => s.color===c.color).length;
  free.sort((a,b) => cnt(b) - cnt(a) || a.id - b.id);
  const c = free[0], h = homeOf(c), bob = Math.sin(now/220) * 6;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,138,61,.9)'; ctx.lineWidth = 3;
  const pr = L.cell*0.5 + (now/12 % 16);
  ctx.globalAlpha = 1 - (now/12 % 16)/16;
  ctx.beginPath(); ctx.arc(h.x, h.y, pr, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.font = `${Math.round(L.cell*0.6)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('👆', h.x + L.cell*0.12, h.y + L.cell*0.15 + bob);
  ctx.restore();
}

function drawLemon(now){
  const c = lemonPick(); if(!c) return;
  const h = homeOf(c);
  ctx.save();
  ctx.strokeStyle = `rgba(242,194,48,${0.6 + 0.4*Math.sin(now/140)})`; ctx.lineWidth = 4;
  const bw = (c.dir%2 ? c.len : 1)*L.cell, bh = (c.dir%2 ? 1 : c.len)*L.cell;
  rr(h.x - bw/2 + 1, h.y - bh/2 + 1, bw - 2, bh - 2, 12); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.font = `${Math.round(L.cell*0.36)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍋', h.x + bw/2 - L.cell*0.12, h.y - bh/2 + L.cell*0.12);
  ctx.restore();
}
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if(S){
    // 长按预览
    if(press && !press.preview && now - press.t > 220) press.preview = true;

    // 巴士时间线
    const bd = busDims();
    for(const bus of S.buses){
      if(now < bus.start) continue;
      const t = (now - bus.start)/1000;
      const cx = Math.min(Math.max(bus.cx, bd.w/2 + 4), W - bd.w/2 - 4);
      if(t < 0.32) bus.x = W + bd.w/2 + (cx - W - bd.w/2) * ease(t/0.32);
      else if(t < 0.75) bus.x = cx;
      else bus.x = cx - (cx + bd.w) * Math.pow((t - 0.75)/0.45, 2);
      if(!bus.hornDone){ bus.hornDone = true; sfx.horn(); }
      if(t >= 0.32 && !bus.fx){
        bus.fx = true;
        sfx.clear(bus.combo);
        burst(cx, bd.y, PALETTE[bus.color]);
        floatText(cx, bd.y - bd.h*0.9, bus.combo > 1 ? `连击 ×${bus.combo}！` : '喵巴士 +1', bus.combo > 1 ? '#FF3D7F' : '#FF6B3D', bus.combo > 1 ? 22 : 18);
        onBusClear(bus, cx, bd.y - bd.h*0.9);
      }
      bus.done = t > 1.25;
    }

    // 车辆运动
    for(const c of S.cars){
      if(c.state==='gone') continue;
      if(c.appear && now >= c.appear){ c.scale = Math.min(1, c.scale + dt*6); if(c.scale>=1) c.appear = 0; }
      if(c.state==='die' && c.bus && now >= c.bus.start){
        const t = (now - c.bus.start)/1000;
        if(t >= 0.18){
          const i = c.bus.cats.indexOf(c);
          const tx = c.bus.x + (i-1)*bd.w*0.27 + bd.w*0.04, ty = bd.y;
          c.x += (tx - c.x) * Math.min(1, dt*18); c.y += (ty - c.y) * Math.min(1, dt*18);
          c.scale = Math.max(0, c.scale - dt*4);
          if(t >= 0.34){ c.state = 'gone'; c.bus.seated = Math.min(3, c.bus.seated + 1); }
          continue;
        }
      }
      if(c.path.length){
        c.speed = Math.min(c.speed + L.cell*60*dt, L.cell*26);
        const p = c.path[0], dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx,dy), v = c.speed*dt;
        if(d <= v){ c.x = p.x; c.y = p.y; c.path.shift(); }
        else { c.x += dx/d*v; c.y += dy/d*v; }
      } else {
        const t = c.state==='die' ? {x:c.dieX, y:c.dieY} : targetOf(c);
        const k = Math.min(1, dt*16);
        c.x += (t.x - c.x)*k; c.y += (t.y - c.y)*k;
      }
      const dm = dimsOf(c), k2 = Math.min(1, dt*12);
      c.dl += (dm.l - c.dl)*k2; c.dw += (dm.w - c.dw)*k2;
      const da = ((dm.a - c.ang + Math.PI*3) % (Math.PI*2)) - Math.PI;
      c.ang += da * k2;
    }
    S.buses = S.buses.filter(b => !b.done);
    for(const p of S.particles){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 400*dt; }
    S.particles = S.particles.filter(p => p.life > 0);
    for(const f of S.floats){ f.life -= dt; f.y -= 40*dt; }
    S.floats = S.floats.filter(f => f.life > 0);

    // 危险心跳
    if(S.slots.length >= S.cap - 2 && !S.over && mask.hidden && now - S.lastBeat > 900){ S.lastBeat = now; sfx.heart(); }

    // 绘制
    ctx.clearRect(0,0,W,H);
    drawScenery(now, dt);
    drawBoard(); drawTray(now);
    const gridCars = S.cars.filter(c => c.state==='grid');
    gridCars.forEach(c => drawCar(c, now));
    if(press && press.preview && press.car.state==='grid') drawPreview(press.car);
    drawHand(now);
    drawLemon(now);
    const rest = S.cars.filter(c => c.state==='slot' || c.state==='buffer' || c.state==='die');
    rest.filter(c => !c.path.length).forEach(c => drawCar(c, now));
    S.buses.forEach(drawBus);
    rest.filter(c => c.path.length).forEach(c => drawCar(c, now));
    for(const p of S.particles){
      ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for(const f of S.floats){
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life)); ctx.fillStyle = f.color;
      ctx.font = `900 ${f.size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline='alphabetic';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
  if(!drawOnly) requestAnimationFrame(frame);
}
let drawOnly = false;

// ---------- 启动 ----------
applyTheme();
resize();
newGame(meta.level);
requestAnimationFrame(frame);
showHome();

// 调试入口：控制台里 mlgc.go(5) 跳关
window.mlgc = { go(n){ closeDialog(); newGame(n); }, daily(stage){ ensureDaily(); closeDialog(); newGame(stage, 'daily'); }, setToday(d){ todayOverride = d; appliedTheme = null; applyTheme(); }, theme(i){ themeOverride = i; appliedTheme = null; applyTheme(); }, state: () => S, meta, freeCars: () => freeCars(), blockerOf: c => blockerOf(c),
  // 自动化测试用：页面在后台时 rAF 不触发，可手动推进若干毫秒
  pump(ms){ const end = performance.now() + ms; while(performance.now() < end){ const s = performance.now(); while(performance.now() - s < 16){} drawOnly = true; frame(performance.now()); drawOnly = false; } } };
})();
</script>
</body>
